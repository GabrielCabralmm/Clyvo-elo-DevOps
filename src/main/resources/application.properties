spring.application.name=clyvo-elo-painel

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clyvoelo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
clyvo.integracoes.api-dotnet=${CLYVO_API_DOTNET_URL:https://clyvoelo-dotnet.onrender.com}
clyvo.integracoes.app-mobile=https://github.com/GabrielCabralmm/clyvo-elo-mobile
