  <ellipse cx="1226" cy="550" rx="26" ry="9" fill="#5B8DB8"/>
  <text x="1266" y="556" font-size="17" font-weight="700" fill="#0B4A8B">Azure Database</text>
  <text x="1266" y="578" font-size="17" font-weight="700" fill="#0B4A8B">for PostgreSQL</text>
  <text x="1200" y="626" font-size="13" fill="#1E3A5F">Flexible Server · PaaS · versão 16</text>
  <text x="1200" y="650" font-size="14" fill="#111827">pg-clyvo-elo-rm563230</text>
  <text x="1200" y="674" font-size="14" fill="#111827">Banco clyvoelo · SSL obrigatório</text>
  <text x="1200" y="698" font-size="14" fill="#111827">tutores, pets, eventos clínicos,</text>
  <text x="1200" y="718" font-size="14" fill="#111827">alertas, funcionários</text>

  <rect x="604" y="780" width="932" height="70" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="624" y="798" width="40" height="32" rx="4" fill="#1F2937"/>
  <path d="M632,808 l8,6 l-8,6 M644,822 h12" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="680" y="810" font-size="16" font-weight="700" fill="#111827">Azure CLI (Cloud Shell) · scripts/criar-recursos.sh</text>
  <text x="680" y="832" font-size="14" fill="#374151">cria o grupo de recursos, o PostgreSQL, o banco, o firewall, o plano, o Web App e as configurações</text>

  <rect x="40" y="560" width="250" height="250" rx="14" fill="#ECF6F0" stroke="#3F8F68" stroke-width="2"/>
