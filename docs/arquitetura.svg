  <rect x="604" y="506" width="430" height="250" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="624" y="534" font-size="14" font-weight="600" fill="#1E3A5F">Plano do Serviço de Aplicativo · plan-clyvo-elo (Linux B1)</text>
  <rect x="624" y="550" width="390" height="186" rx="10" fill="#E0F2FE" stroke="#0369A1"/>
  <rect x="644" y="572" width="44" height="34" rx="4" fill="#0078D4"/>
  <path d="M644,582 h44" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="651" cy="577" r="2" fill="#FFFFFF"/><circle cx="658" cy="577" r="2" fill="#FFFFFF"/>
  <text x="702" y="586" font-size="17" font-weight="700" fill="#0B4A8B">Web App · clyvo-elo-rm563230</text>
  <text x="702" y="606" font-size="13" fill="#1E3A5F">Java 21 (Java SE) · sem container</text>
  <text x="644" y="640" font-size="14" fill="#111827">• Spring Boot 4 + Thymeleaf + Spring Security</text>
  <text x="644" y="664" font-size="14" fill="#111827">• Perfis: Administrador, Veterinário, Tutor</text>
  <text x="644" y="688" font-size="14" fill="#111827">• Flyway cria e versiona as tabelas</text>
  <text x="644" y="712" font-size="14" fill="#111827">• HTTPS · Always On · logs no App Service</text>

  <rect x="1180" y="506" width="356" height="250" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <ellipse cx="1226" cy="550" rx="26" ry="9" fill="#336791"/>
