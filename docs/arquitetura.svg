  <text x="1055" y="298" font-size="13" fill="#92400E" text-anchor="middle">app · app.jar</text>

  <rect x="1166" y="146" width="374" height="140" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="1186" y="174" font-size="17" font-weight="700" fill="#0B4A8B">Release (CD) · ClyvoElo-CD</text>
  <text x="1186" y="196" font-size="13" fill="#6B7280">stage Producao · raio do CD ativado</text>
  <text x="1186" y="224" font-size="14" fill="#111827">• Recebe o artefato novo do CI</text>
  <text x="1186" y="248" font-size="14" fill="#111827">• App settings com os dados do banco</text>
  <text x="1186" y="272" font-size="14" fill="#111827">• Azure App Service deploy (Zip Deploy)</text>

  <rect x="1166" y="300" width="374" height="76" rx="12" fill="#FDF2F8" stroke="#BE185D" stroke-width="1.5"/>
