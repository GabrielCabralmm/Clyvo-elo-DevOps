  <text x="1218" y="354" font-size="13" fill="#831843">SPRING_DATASOURCE_URL, _USERNAME e</text>
  <text x="1218" y="370" font-size="12" fill="#9D174D">_PASSWORD (cadeado: secreta)</text>

