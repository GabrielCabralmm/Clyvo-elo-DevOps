  <text x="1170" y="412" font-size="13" font-weight="600" fill="#1F2937">deploy do app.jar na assinatura do Azure</text>
  <text x="1060" y="628" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">JDBC + SSL</text>
  <text x="400" y="682" font-size="13" font-weight="600" fill="#3F8F68" text-anchor="middle">HTTPS</text>
  <text x="500" y="682" font-size="13" font-weight="600" fill="#3F8F68">CRUD</text>

  <rect x="40" y="900" width="1520" height="220" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="64" y="932" font-size="17" font-weight="700" fill="#111827">Ordem do fluxo</text>
  <g font-size="14" fill="#111827">
    <text x="64" y="962"><tspan font-weight="700">0.</tspan> O desenvolvedor cria os recursos no Azure com o Azure CLI (uma vez).</text>
    <text x="64" y="990"><tspan font-weight="700">1.</tspan> O desenvolvedor altera o código e faz push na master (GitHub e Azure Repos).</text>
    <text x="64" y="1018"><tspan font-weight="700">2.</tspan> O push no Azure Repos dispara automaticamente o Build (CI).</text>
    <text x="64" y="1046"><tspan font-weight="700">3.</tspan> O CI instala o JDK 21, compila com Maven e executa os testes automatizados.</text>
    <text x="64" y="1074"><tspan font-weight="700">4.</tspan> O CI gera o app.jar e publica o artefato no Azure DevOps.</text>
    <text x="820" y="962"><tspan font-weight="700">5.</tspan> O novo artefato dispara automaticamente a Release (CD).</text>
    <text x="820" y="990"><tspan font-weight="700">6.</tspan> A Release lê os dados do banco nas variáveis secretas.</text>
    <text x="820" y="1018"><tspan font-weight="700">7.</tspan> A Release configura o Web App e faz o deploy do app.jar.</text>
    <text x="820" y="1046"><tspan font-weight="700">8.</tspan> O Web App sobe, o Flyway atualiza o PostgreSQL e os dados são gravados nele.</text>
    <text x="820" y="1074"><tspan font-weight="700">9.</tspan> Administrador, veterinário e tutor acessam por HTTPS e fazem o CRUD.</text>
  </g>
</svg>
