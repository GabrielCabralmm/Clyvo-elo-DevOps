  <text x="358" y="382" font-size="13" fill="#374151">Acesso Basic ao projeto</text>
  <text x="358" y="400" font-size="13" fill="#374151">do Azure DevOps: Repos,</text>
    <text x="358" y="418" font-size="13" fill="#374151">Pipelines e execuções</text>

