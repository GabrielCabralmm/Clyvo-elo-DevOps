  <rect width="1600" height="1140" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="28" font-weight="700" fill="#111827">CLYVO Elo — Arquitetura da solução e esteira CI/CD</text>
  <text x="40" y="72" font-size="16" fill="#4B5563">Painel da clínica (Spring Boot) publicado no Azure Web App com banco Azure Database for PostgreSQL, entregue pelo Azure Pipelines (Build + Release)</text>

