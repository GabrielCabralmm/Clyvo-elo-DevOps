  <text x="445" y="238" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">master</text>
  <text x="358" y="272" font-size="13" fill="#6B7280">importado no Azure Repos</text>

  <rect x="580" y="96" width="980" height="300" rx="16" fill="#EFF6FF" stroke="#0078D4" stroke-width="2"/>
  <text x="604" y="128" font-size="20" font-weight="700" fill="#0B4A8B">Azure DevOps</text>
  <text x="770" y="128" font-size="14" fill="#1E3A5F">Projeto “Sprint 4 – Azure DevOps” · Repos · Pipelines · Releases</text>

  <rect x="604" y="146" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="624" y="174" font-size="17" font-weight="700" fill="#0B4A8B">Build (CI) · ClyvoElo-Maven-CI</text>
  <text x="624" y="196" font-size="13" fill="#6B7280">editor clássico · Azure Repos · ubuntu-latest</text>
  <text x="624" y="226" font-size="14" fill="#111827">• Java Tool Installer: JDK 21</text>
  <text x="624" y="252" font-size="14" fill="#111827">• Maven: compila (goal package)</text>
  <text x="624" y="278" font-size="14" fill="#111827">• Executa os testes (JUnit + Mockito)</text>
  <text x="624" y="304" font-size="14" fill="#111827">• Publica os resultados JUnit</text>
  <text x="624" y="330" font-size="14" fill="#111827">• Copy Files + Publish Artifact (app)</text>
  <text x="624" y="360" font-size="12" fill="#6B7280">Trigger: continuous integration na master</text>

  <rect x="980" y="196" width="150" height="120" rx="12" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="1032" y="214" width="46" height="38" rx="4" fill="#D97706"/>
